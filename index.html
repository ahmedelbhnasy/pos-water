:root{--n:#1f3a5f;--m:#2f5486;--bg:#eef1f6;--t:#1c2430;--mu:#667085;--bd:#dfe4ec;--r:#c0392b;--ok:#2e7d32;--w:#c55a11;--l:#f6f8fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:60px 1fr;min-height:100vh}#app.out{grid-template-columns:1fr}#app.out nav{display:none}
#hd{grid-column:1/-1;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}
.br{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;min-width:0}.br i{width:32px;height:32px;border-radius:8px;background:#fff;color:var(--n);display:grid;place-items:center;flex:none}
.hc{display:flex;gap:8px;align-items:center}.hb{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);padding:6px 12px;font-size:13px}.hb:hover{background:rgba(255,255,255,.24)}
.ch{background:#fff;color:var(--n);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700}
nav{background:#fff;border-inline-end:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;background:none;color:var(--t);border:0;border-inline-start:3px solid transparent;text-align:start;padding:10px 14px;border-radius:6px;font-weight:500}
nav button:hover{background:var(--l)}nav button.on{background:#e6ecf5;color:var(--n);font-weight:700;border-inline-start-color:var(--n)}nav svg{flex:none}
main{padding:24px 28px;overflow-x:auto}.pt{margin:0 0 16px;font-size:21px;color:var(--n)}h3{margin:22px 0 10px;font-size:15px;color:var(--n)}
button,.b{background:var(--n);color:#fff;border:1px solid var(--n);padding:8px 14px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
button:hover,.b:hover{background:var(--m)}button:focus-visible{outline:2px solid var(--m);outline-offset:2px}
button.g,.b.g{background:#fff;color:var(--n);border:1px solid #cfd6e2}button.g:hover,.b.g:hover{background:var(--l)}
button.x{background:#fff;color:var(--r);border:1px solid #efc4bf}button.x:hover{background:#fdecea}
table{border-collapse:separate;border-spacing:0;width:100%;margin:0 0 14px;background:#fff;border:1px solid var(--bd);border-radius:8px}
th{background:var(--l);color:var(--mu);font-size:12px;font-weight:600;padding:10px;border-bottom:1px solid var(--bd);text-align:center}

function pb(p){const V=D.v.filter(v=>v.p==p.id),a=t=>V.filter(v=>v.t==t).reduce((s,v)=>s+ +v.a,0);if(p.t=='s'){const Q=D.pu.filter(x=>x.sup==p.id),b=Q.reduce((s,x)=>s+tot(x),0),q=Q.reduce((s,x)=>s+pd(x),0)+a('pay')-a('rec');return{b,pd:q,bal:b-q}}const I=D.i.filter(i=>i.c==p.n),b=I.reduce((s,i)=>s+tot(i),0),q=I.reduce((s,i)=>s+pd(i),0)+a('rec')-a('pay');return{b,pd:q,bal:b-q}}
function PT(t){const s=t=='s',A=D.c.filter(p=>p.t==t),F=PF;
return`<div class=f><label>${L('كشف الحساب من','Statement from')}<input type=date value="${ST.f}" onchange="ST.f=this.value"></label><label>${L('إلى','To')}<input type=date value="${ST.t}" onchange="ST.t=this.value"></label></div><div class=f><label>${L('الاسم','Name')}<input value="${F.n}" oninput="PF.n=this.value"></label><label>${L('الهاتف','Phone')}<input value="${F.ph}" oninput="PF.ph=this.value"></label><label>${L('الرقم الضريبي','VAT No')}<input value="${F.vt}" oninput="PF.vt=this.value"></label><label>${L('العنوان','Address')}<input value="${F.ad}" oninput="PF.ad=this.value"></label><button onclick="pa('${t}')">+ ${s?L('مورد','Supplier'):L('عميل','Customer')}</button></div>
<table>${th([L('الاسم','Name'),L('الهاتف','Phone'),L('الرقم الضريبي','VAT No'),L('العنوان','Address'),...(s?[L('إجمالي المشتريات','Purchases'),L('المسدد','Paid'),L('المتبقي له','Owed to him')]:[L('إجمالي الفواتير','Billed'),L('المسدد','Paid'),L('المتبقي','Balance')]),''])}${A.map(p=>{const k=pb(p);return`<tr><td>${p.n}</td><td><input value="${p.ph||''}" onchange="pc('${p.id}','ph',this.value)"></td><td><input value="${p.vt||''}" onchange="pc('${p.id}','vt',this.value)"></td><td><input value="${p.ad||''}" onchange="pc('${p.id}','ad',this.value)"></td><td>${f2(k.b)}</td><td>${f2(k.pd)}</td><td class="${k.bal>.005?'r':''}">${f2(k.bal)}</td><td><button class=g onclick="stm('${p.id}')">${L('كشف حساب','Statement')}</button> ${can('vou')?`<button onclick="nv('${p.id}')">${L('سند','Voucher')}</button> `:''}<button class=x onclick="pdl('${p.id}')">✕</button></td></tr>`}).join('')}</table>`}
function pa(t){const n=PF.n.trim();if(!n||D.c.some(p=>p.t==t&&p.n==n))return alert(L('اسم مكرر أو فارغ','Empty or duplicate name'));const p={id:'p'+Date.now(),t,n,ph:PF.ph,vt:PF.vt,ad:PF.ad};PF={n:'',ph:'',vt:'',ad:''};if(!CLOUD)D.c.push(p);psC(p);render()}
function pc(id,k,v){const p=D.c.find(x=>x.id==id);if(p){p[k]=v;psC(p)}}
function pdl(id){if(!confirm(L('حذف؟','Delete?')))return;if(CLOUD)W(FS.collection('parties').doc(id).delete());else{D.c=D.c.filter(p=>p.id!=id);lsv();render()}}
function nv0(){return{d:today(),t:'pay',p:'',a:'',m:'cash',nt:'',br:(U&&U.br)||BR||''}}
function nv(id){const p=D.c.find(x=>x.id==id);VE={...nv0(),p:id,t:p&&p.t=='s'?'pay':'rec'};go('vou')}
function svv(pr){const v=VE,p=D.c.find(x=>x.id==v.p);if(!p||!(+v.a>0))return alert(L('اختر الطرف وأدخل مبلغاً','Pick a party and enter an amount'));const x={id:Math.max(0,...D.v.map(y=>y.id))+1,d:v.d,t:v.t,p:p.id,pn:p.n,pt:p.t,a:+v.a,m:v.m,nt:v.nt,k:U.n,br:(U.r!='o'&&U.br)||v.br||''};VE=null;if(!CLOUD)D.v.push(x);psV(x);if(pr)pv(x);render()}
function vdl(id){if(!confirm(L('حذف السند؟','Delete voucher?')))return;if(CLOUD)W(FS.collection('vouchers').doc(String(id)).delete());else{D.v=D.v.filter(v=>v.id!=id);lsv();render()}}
function pv(x){const v=typeof x=='object'?x:D.v.find(j=>j.id==x),pay=v.t=='pay',M={cash:L('كاش','Cash'),card:L('شبكة','Card'),bank:L('تحويل بنكي','Bank transfer')};
$('note').innerHTML=`<h3 style="text-align:center;font-size:22px">${D.s.co}</h3><p style="text-align:center">${D.s.det}</p><h2>${pay?L('سند صرف','Payment Voucher'):L('سند قبض','Receipt Voucher')}</h2><p>${L('رقم','No')}: <b>${v.id}</b> &nbsp; ${L('التاريخ','Date')}: <b>${v.d}</b></p><table><tr><th>${pay?L('صرفنا إلى','Paid to'):L('استلمنا من','Received from')}</th><td>${v.pn}</td></tr><tr><th>${L('المبلغ','Amount')} (${D.s.cur})</th><td><b>${f2(v.a)}</b></td></tr><tr><th>${L('طريقة الدفع','Method')}</th><td>${M[v.m]}</td></tr>${v.br?`<tr><th>${L('الفرع','Branch')}</th><td>${esc(bn(v.br))}</td></tr>`:''}<tr><th>${L('البيان','Note')}</th><td>${v.nt||''}</td></tr></table><div class=s><span>${L('المحاسب','Accountant')}: ..........</span><span>${pay?L('المستلم','Receiver'):L('المسلّم','Payer')}: ..........</span></div>`;setTimeout(()=>print(),50)}
/* ===== accounts ===== */
async function sha(s){if(!window.crypto||!crypto.subtle){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pos|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const em=n=>[...new TextEncoder().encode(n.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@pos.app',bad=n=>!n||em(n).length>72;
function lg(){const f=!CLOUD&&!D.u.length;return`<div class=lc><div class=lg>${ic('inv')}</div><h3>${f?L('إنشاء حساب المدير','Create owner account'):L('تسجيل الدخول','Login')}</h3><label>${L('اسم المستخدم','Username')}<input id=un autocomplete=username></label><label>${L('كلمة المرور','Password')}<input id=pw type=password onkeydown="if(event.key=='Enter')login()"></label><button onclick="login()">${f?L('إنشاء','Create'):L('دخول','Login')}</button>${CLOUD?`<a class=lk onclick="mkowner()">${L('إنشاء حساب المدير لأول مرة','First-time owner setup')}</a>`:`<p class=mu>${L('وضع محلي: البيانات على هذا الجهاز فقط','Local mode: data on this device only')}</p>`}</div>`}
async function login(){const n=$('un').value.trim(),pw=$('pw').value;if(!n||!pw)return;
if(CLOUD){try{await AUTH.signInWithEmailAndPassword(em(n),pw)}catch(e){alert(L('بيانات غير صحيحة','Wrong login'))}return}
const h=await sha(pw);if(!D.u.length){D.u.push({n,h,r:'o',pm:{},st:1});lsv();return en(D.u[0])}
const u=D.u.find(x=>x.n==n&&x.h==h);u?en(u):alert(L('بيانات غير صحيحة','Wrong login'))}
async function mkowner(){const n=$('un').value.trim(),pw=$('pw').value;if(bad(n)||pw.length<6)return alert(L('اسم المستخدم قصير والرقم السري 6 أحرف على الأقل','Short username required, password 6+ chars'));
BUSY=true;let st='auth';
try{let c;try{c=await AUTH.createUserWithEmailAndPassword(em(n),pw)}catch(e){if(e.code=='auth/email-already-in-use')c=await AUTH.signInWithEmailAndPassword(em(n),pw);else throw e}
const uid=c.user.uid;st='read-user';const ex=await FS.doc('users/'+uid).get();
if(!ex.exists){st='write-user';await FS.doc('users/'+uid).set({n,r:'o',pm:{},st:1});st='write-meta';await FS.doc('pos/meta').set({ownerSet:true});st='write-settings';await FS.doc('pos/settings').set({s:D.s,p:D.p})}
BUSY=false;await ec(c.user)}
catch(e){BUSY=false;alert('['+st+'] '+(e.code||'')+' '+e.message)}}
async function ec(u){UN.forEach(f=>f());UN=[];if(!u){U=null;D.i=[];D.u=[];D.c=[];D.v=[];D.sk={};D.pu=[];D.aj=[];render();return}
try{const d=await FS.doc('users/'+u.uid).get();if(!d.exists)throw 0;en({id:u.uid,...d.data()})}catch(e){await AUTH.signOut();alert(L('الحساب غير مفعّل','Account not enabled'))}}
function sub(){const own=U.r=='o',v=own||U.pm.inv;
UN.push(FS.doc('pos/settings').onSnapshot(d=>{if(d.exists){D.s=d.data().s;D.p=d.data().p;ids();rr()}}));
if(own||U.pm.rep)UN.push(FS.doc('pos/qoyod').onSnapshot(d=>{D.q=d.exists?d.data().q:{};rr()}));
let q=FS.collection('invoices');if(!v)q=q.where('k','==',U.n);UN.push(q.onSnapshot(s=>{D.i=s.docs.map(d=>d.data());rr()},e=>alert(e.message)));
const pe_=e=>{if(!PA){PA=1;alert(L('حدّث قواعد Firestore لتفعيل الأقسام الجديدة','Update Firestore rules to enable the new sections'))}};
if(own||U.pm.cus||U.pm.sell)UN.push(FS.collection('parties').onSnapshot(s=>{D.c=s.docs.map(d=>d.data());rr()},pe_));
if(own||U.pm.vou)UN.push(FS.collection('vouchers').onSnapshot(s=>{D.v=s.docs.map(d=>d.data());rr()},pe_));
if(own||U.pm.stk||U.pm.sell)UN.push(FS.collection('stock').onSnapshot(s=>{D.sk={};s.docs.forEach(d=>D.sk[d.id]=+d.data().q||0);rr()},pe_));
if(own||U.pm.stk)UN.push(FS.collection('purchases').onSnapshot(s=>{D.pu=s.docs.map(d=>d.data());rr()},pe_));
if(own||U.pm.stk)UN.push(FS.collection('adjust').onSnapshot(s=>{D.aj=s.docs.map(d=>d.data());rr()},pe_));
if(own)UN.push(FS.collection('users').onSnapshot(s=>{D.u=s.docs.map(d=>({id:d.id,...d.data()}));rr()}))}
function en(u){U=u;U.pm=U.pm||{};ids();if(CLOUD)sub();else sessionStorage.setItem('pu',u.n);E=null;go(can('rep')?'home':can('sell')?'new':'inv')}
function lo(){E=null;if(CLOUD){AUTH.signOut();return}U=null;sessionStorage.removeItem('pu');render()}
async function au(){const n=$('nn').value.trim(),p=$('np').value;if(bad(n)||p.length<6||D.u.some(u=>u.n==n))return alert(L('اسم مكرر أو ناقص أو طويل، وكلمة المرور 6 أحرف+','Duplicate/empty/long name, password needs 6+ chars'));
if(CLOUD){try{SEC=SEC||firebase.initializeApp(CFG,'sec');const c=await SEC.auth().createUserWithEmailAndPassword(em(n),p);await SEC.auth().signOut();await FS.doc('users/'+c.user.uid).set({n,r:'c',pm:{sell:true},st:1000*D.u.length+1})}catch(e){alert(e.message)}return}
D.u.push({n,h:await sha(p),r:'c',pm:{sell:true},st:1000*D.u.length+1});lsv();render()}
async function rp(j){const p=prompt(L('كلمة المرور الجديدة','New password'));if(p){D.u[j].h=await sha(p);lsv();alert(L('تم','Done'))}}
function du(j){if(!confirm(L('حذف المستخدم؟','Delete user?')))return;if(CLOUD)W(FS.doc('users/'+D.u[j].id).delete());else{D.u.splice(j,1);lsv();render()}}
async function cpw(){const p=prompt(L('كلمة المرور الجديدة (6 أحرف+)','New password (6+ chars)'));if(!p||p.length<6)return;
try{if(CLOUD)await AUTH.currentUser.updatePassword(p);else{U.h=await sha(p);lsv()}alert(L('تم تغيير كلمة المرور','Password changed'))}catch(e){alert(e.message)}}
/* ===== boot ===== */
const ls=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=()=>j(new Error(src));document.head.appendChild(s)});
async function boot(){setL();
if(!CLOUD){try{U=D.u.find(u=>u.n==sessionStorage.getItem('pu'))||null;if(U){U.pm=U.pm||{};ids();go(can('rep')?'home':can('sell')?'new':'inv')}}catch(e){}$('ld').remove();render();return}
try{for(const f of['app','auth','firestore'])await ls(`https://www.gstatic.com/firebasejs/10.12.2/firebase-${f}-compat.js`);
firebase.initializeApp(CFG);AUTH=firebase.auth();FS=firebase.firestore();
AUTH.onAuthStateChanged(u=>{if(BUSY)return;const l=$('ld');if(l)l.remove();ec(u)})}
catch(e){$('ld').textContent=L('تعذر الاتصال بالسحابة. تأكد من الإنترنت وإعدادات Firebase.','Cannot reach the cloud. Check your internet and Firebase config.')}}
boot();</script></body></html>
